name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep the workflow read-only unless a future job explicitly needs another scope.
permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          # Keep CI on the published toolchain channel. Removed point releases
          # return HTTP 403 from the registry, so an expired hard-coded version
          # would fail before any project check runs.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Type check
        run: moon check

      - name: Test (wasm-gc)
        run: moon test

      - name: Test (JavaScript)
        run: moon test --target js

      - name: Test (native)
        run: moon test --target native

      - name: Verify committed web artifacts are reproducible
        run: node scripts/build-web.mjs --check

      - name: Verify linear-memory WebAssembly integration
        run: node verify-wasm.mjs

      - name: Run CLI demos (end-to-end smoke test)
        run: |
          moon run cmd/ppm > /dev/null
          moon run cmd/showcase > /dev/null
          moon run --target native cmd/cli -- --help > /dev/null
