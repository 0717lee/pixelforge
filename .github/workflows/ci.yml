name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep the workflow read-only unless a future job explicitly needs another scope.
permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The installer accepts an exact release argument. Update deliberately when
  # upgrading MoonBit so local and CI diagnostics remain reproducible.
  MOONBIT_VERSION: 0.1.20260827

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Type check
        run: moon check

      - name: Test (wasm-gc)
        run: moon test

      - name: Test (JavaScript)
        run: moon test --target js

      - name: Test (native)
        run: moon test --target native

      - name: Verify committed web artifacts are reproducible
        run: node scripts/build-web.mjs --check

      - name: Verify linear-memory WebAssembly integration
        run: node verify-wasm.mjs

      - name: Run CLI demos (end-to-end smoke test)
        run: |
          moon run cmd/ppm > /dev/null
          moon run cmd/showcase > /dev/null
          moon run cmd/cli -- --help > /dev/null
