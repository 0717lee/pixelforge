name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep the workflow read-only unless a future job explicitly needs another scope.
permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The installer version is the Moon compiler version shown by `moonc`, not
  # the Moon CLI date version. This release remains available in the registry
  # and reproduces the committed JS/WASM artifacts.
  MOONBIT_VERSION: 0.10.11+6ff76a5f9

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Resolve registry dependencies
        run: moon update

      - name: Type check
        run: moon check

      - name: Test (wasm-gc)
        run: moon test

      - name: Test (JavaScript)
        run: moon test --target js

      - name: Test (native)
        run: moon test --target native

      - name: Verify committed web artifacts are reproducible
        run: node scripts/build-web.mjs --check

      - name: Verify linear-memory WebAssembly integration
        run: node verify-wasm.mjs

      - name: Run CLI demos (end-to-end smoke test)
        run: |
          moon run cmd/ppm > /dev/null
          moon run cmd/showcase > /dev/null
          moon run --target native cmd/cli -- --help > /dev/null
